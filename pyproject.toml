[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-zero"
version = "0.1.0"
description = "MCP Zero"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "starlette>=0.36",
    "uvicorn>=0.29",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
mcp-zero = "mcp_zero.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
