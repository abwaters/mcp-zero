name: reconcile docs

on:
  workflow_dispatch:
    inputs:
      prompt_path:
        description: "Path to the prompt markdown file"
        required: false
        default: ".claude/prompts/docs-reconcile.md"
        type: string
      model:
        description: "Claude model (optional; leave default unless you need Opus)"
        required: false
        default: "claude-sonnet-4-5"
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-docs-reconcile
  cancel-in-progress: false

jobs:
  reconcile-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Read prompt file
        id: prompt
        shell: bash
        run: |
          set -euo pipefail
          PROMPT_PATH="${{ github.event.inputs.prompt_path }}"
          if [[ ! -f "$PROMPT_PATH" ]]; then
            echo "Prompt file not found: $PROMPT_PATH" >&2
            exit 1
          fi
          {
            echo "text<<EOF"
            cat "$PROMPT_PATH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Action (automation mode)
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Feed the prompt from the repo file.
          prompt: ${{ steps.prompt.outputs.text }}

          # Optional tuning.
          claude_args: |
            --model ${{ github.event.inputs.model }}
            --max-turns 40
            --allowedTools "Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Edit,Read,Write,Glob,Grep"

      # Optional: surface a quick summary in logs (the action itself posts updates/comments as it runs).
      - name: Done
        run: echo "Claude docs reconciliation run completed."
