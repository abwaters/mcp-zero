name: Dependency Review

on:
  pull_request:
    branches: [main]

# Read-only token; the action posts its summary via the PR comment below.
permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Block PRs that introduce dependencies with known
          # moderate-or-higher vulnerabilities.
          fail-on-severity: moderate
          # Flag dependencies whose licenses are incompatible with the
          # project's MIT license.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
          comment-summary-in-pr: on-failure
