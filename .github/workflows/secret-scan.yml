name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Gitleaks (MIT-licensed) runs entirely in CI and needs no token, so this
# works even on private repos without GitHub Advanced Security. Run alongside
# (not instead of) GitHub native secret scanning.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      # Bump manually (Dependabot can't track a CLI download URL). Update the
      # checksum from the release's gitleaks_<ver>_checksums.txt when bumping.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so Gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Install Gitleaks (verify checksum)
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan git history for secrets
        # Exits non-zero (failing the job) if any secret is found.
        # --redact keeps secret values out of the logs.
        run: ./gitleaks git . --redact --verbose
