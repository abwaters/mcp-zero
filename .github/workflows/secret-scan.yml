name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Run alongside (not instead of) GitHub native secret scanning. This gives
# secret detection in CI even on private repos without Advanced Security.
permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          # Full history so the action can diff the pushed/PR commit range.
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          # Report verified secrets and ones the verifier can't classify;
          # drop noisy unverified matches.
          extra_args: --results=verified,unknown
